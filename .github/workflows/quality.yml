name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - name: Select a browser for Playwright
        run: |
          if browser=$(command -v google-chrome || command -v chromium); then
            "$browser" --version
            echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:ui
      - run: npm run test:quality-ui
