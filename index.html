<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌷 Góc Học Nhỏ — Một góc nhỏ cho những ngày cố gắng</title>
  <meta name="description" content="Planner ôn thi theo tuần cute, cozy, có mascot đồng hành, Pomodoro và góc học ảo.">
  <meta name="theme-color" content="#FFF8EC">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mascot.css">
  <link rel="stylesheet" href="css/room.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/sidebar-toggle.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>
  <a href="#main" id="skip-link" class="skip-link">Chuyển đến nội dung chính</a>
  <div class="app" id="app">
    <header class="app-header" id="app-header" aria-label="Đầu trang"></header>
    <section id="notification-panel" class="notification-panel" aria-labelledby="notification-title" hidden>
      <div class="notification-heading">
        <h2 id="notification-title">Thông báo</h2>
        <button type="button" class="icon-btn" id="close-notifications" aria-label="Đóng thông báo">×</button>
      </div>
      <div id="notification-items"></div>
    </section>
    <div class="app-body">
      <aside class="sidebar" id="sidebar" aria-label="Thông tin phụ và điều hướng"></aside>
      <div class="right-content">
        <div id="notification-banner" class="notification-banner" hidden>
          <div class="notification-banner-inner">
            <div class="notification-banner-bar">
              <span class="notification-banner-icon" aria-hidden="true">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M4 10v4h4l11 4V6L8 10H4zM8 14l2 6h3l-2-5M22 10v4"/>
                </svg>
              </span>
              <span class="notification-banner-label">THÔNG BÁO</span>
              <span class="notification-banner-content" role="status"></span>
              <button class="notification-banner-close" type="button" aria-label="Ẩn thông báo này">×</button>
            </div>
          </div>
        </div>
        <main class="main" id="main" tabindex="-1"></main>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng nhanh"></nav>
  <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>
  <button class="timer-pill" id="timer-pill" type="button" hidden aria-label="Đồng hồ Pomodoro đang chạy"></button>

  <div id="modal-root"></div>
  <div id="reward-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
